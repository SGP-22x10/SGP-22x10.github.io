<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Hồ Cá Vui Nhộn</title>
  <link rel="stylesheet" href="mystyle.css">
</head>
<body>
  <div class="aquarium">
    <!-- Các thợ lặn -->
    <img src="images/diver1.png" alt="Thợ lặn 1" class="obj diver1">
    <img src="images/diver2.png" alt="Thợ lặn 2" class="obj diver2">
    <img src="images/diver3.png" alt="Thợ lặn 3" class="obj diver3">

    <!-- Đàn cá -->
    <img src="images/faintSchool.png" alt="Đàn cá nhạt" class="obj faint-school">
    <img src="images/goldFishSchool.png" alt="Đàn cá vàng" class="obj goldfish-school">

    <!-- Cá mập và Rùa -->
    <img src="images/shark.png" alt="Cá mập" class="obj shark">
    <img src="images/turtle.png" alt="Rùa biển" class="obj turtle">
  </div>
</body>
</html>
